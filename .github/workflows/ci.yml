name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
        with:
          dev-shell: ci
      - uses: totto2727-org/monorepo/.github/actions/setup-moonbit@main
        with:
          dev-shell: ci
      - uses: totto2727-org/monorepo/.github/actions/check-moonbit@main
        with:
          dev-shell: ci
      - name: Test linear Wasm
        run: nix develop .#ci --command moon test --target wasm
      - name: Check optional TUI example
        run: nix develop .#ci --command moon -C examples check --target native --deny-warn ./tui/src/main
