name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
        with:
          dev-shell: ci
      - uses: totto2727-org/monorepo/.github/actions/publish-moonbit@main
        with:
          dev-shell: ci
          token: ${{ secrets.MOONCAKES_TOKEN }}
          package-path: .
