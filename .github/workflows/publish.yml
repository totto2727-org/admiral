name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
        with:
          dev-shell: ci
      - uses: totto2727-org/monorepo/.github/actions/publish-moonbit@main
        with:
          dev-shell: ci
          token: ${{ secrets.MOONCAKES_TOKEN }}
          package-path: .
