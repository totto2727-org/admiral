name: Publish

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PUBLISH to confirm the authenticated release.
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: inputs.confirm == 'PUBLISH'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
      - name: Confirm release
        shell: bash
        env:
          PUBLISH_CONFIRMATION: ${{ inputs.confirm }}
        run: test "$PUBLISH_CONFIRMATION" = PUBLISH
      - uses: totto2727-org/monorepo/.github/actions/publish-moonbit@main
        with:
          token: ${{ secrets.MOONCAKES_TOKEN }}
          package-path: .
